    graphs.set('overall',overview);
    flows.unshift({id:'overall',group:'Overview',label:'Overall flow — all modules',basis:'All '+moduleCount+' modules · Solid arrows show journeys; dotted arrows show optional or supporting workflows.',steps:[]});
    flowMap.set('overall',flows[0]);

    const svg=q('fc-svg'),select=q('fc-select'),back=q('fc-back'),play=q('fc-play'),next=q('fc-step'),crumbs=q('fc-crumbs');

    function renderCrumbs(){

      q('fc-detail').textContent=inspection?inspection.detail:selected==='overall'?edge.detail:node.detail;

    function dimensions(n){const size=selected==='overall'?{w:178,h:60}:n.kind==='terminal'?{w:156,h:56}:n.kind==='decision'?{w:208,h:108}:{w:194,h:n.target?84:78};return{...size,kind:n.kind};}
    function layout(){

      if(selected==='authentication'){
        const loc={start:[130,100],login:[380,100],allowed:[630,100],session:[880,100],use:[1130,100],denied:[630,232],'logout-question':[1130,342],logout:[880,342],'signed-out':[630,342],'refresh-question':[1130,486],refresh:[880,486]};

      g.trace.forEach((id,i)=>{const row=Math.floor(i/5),col=row%2?4-i%5:i%5;const n=g.nodes.find(n=>n.id===id);positions.set(id,{x:130+col*250,y:100+row*280,row,col,...dimensions(n)});});

    }
    function port(p,side){if(side==='top')return{x:p.x,y:p.y-p.h/2};if(side==='bottom')return{x:p.x,y:p.y+p.h/2};const inset=p.kind==='input'?6.5:0;if(side==='left')return{x:p.x-p.w/2+inset,y:p.y};return{x:p.x+p.w/2-inset,y:p.y};}
    function edgeRoute(e,index){
      const a=positions.get(e.from),b=positions.get(e.to),g=graph();let points;
      const P=(x,y)=>({x,y});
      if(e.fromSide){points=[port(a,e.fromSide),...(e.via||[]).map(v=>P(...v)),port(b,e.toSide)];}
      else if(selected==='authentication'&&(e.route==='return-left')){
        if(e.from==='refresh-question')points=[port(a,'right'),P(1286,a.y),P(1286,b.y),port(b,'right')];
        else points=[port(a,'top'),P(a.x,418),P(1258,418),P(1258,b.y),port(b,'right')];
      }else if(e.route==='return-right'){
        const bottom=a.y+a.h/2+24+(index%3)*7,roof=b.y-b.h/2-24;
        points=[port(a,'bottom'),P(a.x,bottom),P(12+(index%3)*8,bottom),P(12+(index%3)*8,roof),P(b.x,roof),port(b,'top')];
      }else if(g.trace.indexOf(e.to)===g.trace.indexOf(e.from)+1&&g.trace.includes(e.from)&&a.y!==b.y){
        const rail=Math.max(a.x+a.w/2,b.x+b.w/2)+32;
        points=[port(a,'right'),P(rail,a.y),P(rail,b.y),port(b,'right')];
      }else if(Math.abs(a.y-b.y)<1){const right=b.x>a.x;points=[port(a,right?'right':'left'),port(b,right?'left':'right')];}
      else if(Math.abs(a.x-b.x)<1){const down=b.y>a.y;points=[port(a,down?'bottom':'top'),port(b,down?'top':'bottom')];}

        const down=b.y>a.y,p1=port(a,down?'bottom':'top'),p2=port(b,down?'top':'bottom'),mid=(p1.y+p2.y)/2;

      const horizontal=best[0].y===best[1].y;
      let label={x:(best[0].x+best[1].x)/2+(horizontal?0:9),y:(best[0].y+best[1].y)/2+(horizontal?-7:4),anchor:horizontal?'middle':'start'};

    }
    const measureCanvas=document.createElement('canvas'),measure=measureCanvas.getContext('2d');
    function wrapText(text,width,size){

      const measureWidth=s=>measure?measure.measureText(s).width:s.length*size*.54;
      const lines=[];let line='';
      for(const word of text.split(/\s+/)){const candidate=line?line+' '+word:word;if(line&&measureWidth(candidate)>width){lines.push(line);line=word;}else line=candidate;}
      if(line)lines.push(line);return lines;
    }
    function draw(){
      const g=graph();layout();nodeEls=new Map();edgeEls=[];svg.replaceChildren();
      const title=make('title',{id:'fc-title'});title.textContent=flowMap.get(selected).label;svg.append(title);
      const desc=make('desc',{id:'fc-description'});desc.textContent=selected==='overall'?'All 21 TicketLedger modules and their relationships. Click a module or choose it from the dropdown to open its flow. Dotted arrows indicate related or optional workflows.':'Animated flowchart. Yes and No label decision branches. Nodes marked Open flow open their own module. Use Back to return.';svg.append(desc);

      marker.append(make('path',{d:'M 1 1 L 9 5 L 1 9 Z',fill:'var(--edge)'}));defs.append(marker);svg.append(defs);
      if(selected==='overall'){
        for(const [label,y] of [['ACCOUNT & ACCESS',14],['EVENTS & TICKETS',232],['BEHAVIOR & ANALYTICS',442]])svg.append(textEl(label,{x:21,y,class:'lane-label'}));
        svg.append(make('line',{x1:21,y1:420,x2:1179,y2:420,class:'lane-line'}));

      const points=[];

        const p=positions.get(n.id),x=p.x-p.w/2,y=p.y-p.h/2;
        points.push({x:x-16,y:y-16},{x:x+p.w+16,y:y+p.h+16});
        const el=make('g',{class:'fc-node '+n.kind,'data-node':n.id,role:n.target?'button':'group','aria-label':n.target?'Open '+flowMap.get(n.target).label+' workflow':n.label});
        const tip=make('title');tip.textContent=n.label+(n.target?' — Open flow':'')+'. '+n.detail;el.append(tip);
        let shape;
        if(n.kind==='terminal')shape=make('ellipse',{cx:p.x,cy:p.y,rx:p.w/2,ry:p.h/2});
        else if(n.kind==='decision')shape=make('polygon',{points:p.x+','+y+' '+(x+p.w)+','+p.y+' '+p.x+','+(y+p.h)+' '+x+','+p.y});
        else if(n.kind==='input')shape=make('polygon',{points:(x+13)+','+y+' '+(x+p.w)+','+y+' '+(x+p.w-13)+','+(y+p.h)+' '+x+','+(y+p.h)});
        else shape=make('rect',{x,y,width:p.w,height:p.h,rx:2});
        shape.setAttribute('class','shape');el.append(shape);
        const innerW=p.w*(n.kind==='decision'?.6:n.kind==='terminal'?.8:.87),size=15,lines=wrapText(n.label,innerW,size),lineHeight=17;
        const offset=n.target?7:0,label=make('text',{x:p.x,y:p.y-(lines.length-1)*lineHeight/2-offset,'text-anchor':'middle','dominant-baseline':'central',class:'node-label'});
        lines.forEach((line,i)=>{const span=make('tspan',{x:p.x,dy:i?lineHeight:0});span.textContent=line;label.append(span);});el.append(label);
        if(n.target){
          el.setAttribute('tabindex','0');el.setAttribute('data-target',n.target);
          el.append(textEl('Open flow ↗',{x:p.x,y:p.y+(lines.length-1)*lineHeight/2+15,'text-anchor':'middle',class:'node-open'}));
          el.addEventListener('click',()=>openFlow(n.target,{fromNode:n.id,focus:true}));
          el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openFlow(n.target,{fromNode:n.id,focus:true});}});
        }else{el.addEventListener('click',()=>{inspection=n;current().playing=false;update(true);});}
        svg.append(el);nodeEls.set(n.id,el);
      }
      halo=make('circle',{r:10,class:'fc-halo','aria-hidden':'true'});packet=make('circle',{r:4,class:'fc-packet','aria-hidden':'true'});svg.append(halo,packet);
      const minX=Math.min(...points.map(p=>p.x))-16,maxX=Math.max(...points.map(p=>p.x))+16,minY=selected==='overall'?-4:Math.min(...points.map(p=>p.y))-16,maxY=Math.max(...points.map(p=>p.y))+30;
      bounds={x:minX,y:minY,w:maxX-minX,h:maxY-minY};fit();update();
    }
    function applyCamera(){svg.setAttribute('viewBox',[camera.x,camera.y,camera.w,camera.h].join(' '));q('zoom-level').textContent=Math.round(zoom*100)+'%';q('zoom-out').disabled=zoom<=.61;q('zoom-in').disabled=zoom>=4.99;}
    function fit(){camera={...bounds};zoom=1;applyCamera();}
    function zoomBy(factor,client){
      const value=Math.max(.6,Math.min(5,zoom*factor)),ratio=zoom/value;
      const center=client?clientToDiagram(client.x,client.y):{x:camera.x+camera.w/2,y:camera.y+camera.h/2};

    }
    function clientToDiagram(x,y){const r=svg.getBoundingClientRect(),scale=Math.min(r.width/camera.w,r.height/camera.h);return{x:camera.x+(x-r.left-(r.width-camera.w*scale)/2)/scale,y:camera.y+(y-r.top-(r.height-camera.h*scale)/2)/scale};}

    }
    function advance(announce=false){const st=current();inspection=null;if(st.cursor<count()-1){st.cursor++;st.phase=0;}else{st.finished=true;st.playing=false;st.phase=0;}update(announce);}
    function tick(time){const dt=last?Math.min(80,time-last):0;last=time;if(current().playing&&!current().finished&&!document.hidden){const st=current();st.phase+=dt;if(st.phase>=(activeEdge()?dwell+travel:dwell))advance();movePacket();}requestAnimationFrame(tick);}
    back.addEventListener('click',goBack);
    q('brand-home').addEventListener('click',goHome);
    select.addEventListener('change',()=>{if(select.value==='overall')goHome();else if(select.value!==selected)openFlow(select.value,{focus:true});});
    play.addEventListener('click',()=>{const st=current();inspection=null;if(st.finished){st.cursor=0;st.phase=0;st.finished=false;}st.playing=!st.playing;last=0;update(true);});
    next.addEventListener('click',()=>{current().playing=false;advance(true);});

    const endDrag=()=>{drag=null;svg.classList.remove('is-dragging');};svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);svg.addEventListener('lostpointercapture',endDrag);
    svg.addEventListener('wheel',event=>{if(event.ctrlKey||event.metaKey)return;event.preventDefault();zoomBy(event.deltaY<0?1.12:1/1.12,{x:event.clientX,y:event.clientY});},{passive:false});

    document.addEventListener('visibilitychange',()=>{last=0;});

    openFlow('overall',{root:true});requestAnimationFrame(tick);
  })();
